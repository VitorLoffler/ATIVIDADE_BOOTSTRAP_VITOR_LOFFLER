  <header></header>

  <main>

    <body class="bg-light">
    
        <!-- Container centralizado com margem superior (mt-5) -->
         <div class="container mt-5">
    
          <div class="container my-5">
            <h3 class="mb-4 display-4 fw-bold">Solicitar Serviço</h3>
            <div class="card shadow">
              <div class="card-body p-4">
          
                <form>
          
                  <!-- DADOS DO CLIENTE EM COLUNAS LADO A LADO -->
                  <div class="row g-3">
                    <div class="col-12 col-md-6">
                      <label class="form-label text-danger">Nome Completo *</label>
                      <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person text-primary"></i></span>
                        <input type="text" class="form-control" placeholder="Seu nome" required>
                      </div>
                    </div>
          
                    <div class="col-12 col-md-6">
                      <label class="form-label text-danger">Email *</label>
                      <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope text-primary"></i></span>
                        <input type="email" class="form-control" placeholder="seu@email.com" required>
                      </div>
                    </div>
          
                    <!-- TELEFONE / WHATSAPP COM INPUT-GROUP -->
                    <div class="col-12 col-md-6">
                      <label class="form-label text-danger">Telefone / WhatsApp *</label>
                      <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-whatsapp text-primary"></i></span>
                        <span class="input-group-text">+55</span>
                        <input type="tel" class="form-control" placeholder="(42) 99999-9999" required>
                      </div>
                    </div>
          
                    <!-- VALOR ESTIMADO COM INPUT-GROUP -->
                    <div class="col-12 col-md-6">
                      <label class="form-label text-danger">Valor Estimado</label>
                      <div class="input-group">
                        <span class="input-group-text text-primary">R$</span>
                        <input type="number" class="form-control" placeholder="0,00">
                      </div>
                    </div>
          
                    <!-- TIPO DE SERVIÇO COM FORM-SELECT -->
                    <div class="col-12">
                      <label class="form-label text-danger">Tipo de Serviço *</label>
                      <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-gear text-primary"></i></span>
                        <select class="form-select" required>
                          <option value="" selected disabled>Selecione o tipo de serviço...</option>
                          <option value="manutencao">Manutenção</option>
                          <option value="instalacao">Instalação</option>
                          <option value="orcamento">Orçamento</option>
                          <option value="consultoria">Consultoria</option>
                          <option value="outro">Outro</option>
                        </select>
                      </div>
                    </div>
          
                    <!-- OBSERVAÇÕES COM TEXTAREA -->
                    <div class="col-12">
                      <label class="form-label text-danger">Observações</label>
                      <textarea class="form-control" rows="4" placeholder="Descreva o que você precisa, detalhes, prazo, etc..."></textarea>
                    </div>
          
                    <!-- CONFIRMAÇÃO DE CIÊNCIA ANTES DO ENVIO -->
                    <div class="col-12">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="ciencia" required>
                        <label class="form-check-label text-danger" for="ciencia">
                          Estou ciente de que os dados informados serão usados para contato e orçamento, e confirmo o envio deste formulário. *
                        </label>
                      </div>
                    </div>
          
                    <!-- BOTÃO ENVIAR -->
                    <div class="col-12">
                      <div class="d-grid">
                        <button type="submit" class="btn btn-success btn-lg">
                          <i class="bi bi-send"></i> Enviar Solicitação
                        </button>
                      </div>
                    </div>
          
                  </div>
                </form>
          
              </div>
            </div>
          </div>
    
         </div>
